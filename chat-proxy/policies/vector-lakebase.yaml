policies:
  - intent_id: vector_lakebase_definition
    fixed_facts:
      - "Vector Lakebase separates compute from storage and stores multimodal data, vectors, attributes, indexes, and metadata in low-cost object storage in open formats."
      - "Vector Lakebase supports serving, discovery, and analytics workloads on the same lake-native data foundation."
      - "Vector Database is part of Vector Lakebase product scope."
    must_include:
      - "a new, lake-native architecture"
      - "separating compute from storage"
      - "same shared lake-native data foundation"
    trigger_phrases:
      - "What is a Vector Lakebase?"
      - "what is a vector lakebase"
      - "define vector lakebase"
    must_not_say:
      - "Vector Lakebase is only a traditional vector database"
      - "Vector Lakebase requires tightly coupled compute and storage"
    fallback_response: |
      A Vector Lakebase is a new, lake-native architecture that combines the low-latency serving capabilities of vector databases with the openness, scalability, and economics of the multi-modal data lake. Vector Lakebases are enabled by a fundamentally new design: separating compute from storage and placing multi-modal data, vectors, attributes, indexes, and metadata directly in low-cost object storage in open formats, while allowing serving, discovery, and analytics workloads to run independently on top.
      A more intuitive way to understand it is by comparing it to both traditional big data infrastructure and vector databases:
      In the big data era, data lakes, database engines, and warehouses became the standard infrastructure stack for large-scale data management, serving, and analytics. Vector Lakebase is the equivalent infrastructure stack for the era of vectors, indexes, and semantic context.
      Traditional vector databases are mainly optimized for online retrieval serving, with compute, storage, and indexes tightly coupled inside a single serving system. While highly effective for dedicated retrieval workloads, this architecture often creates data silos and duplicated pipelines across serving, discovery, and analytics systems. In contrast, a Vector Lakebase allows real-time serving, interactive discovery, and offline analytics workloads to operate directly on the same shared lake-native data foundation, enabling a more unified and scalable architecture for AI applications.
      A Vector Lakebase has the following key features:
      Storage is separated from compute:
      Multi-modal data, vectors, indexes, and metadata are stored in low-cost object storage, while serving, discovery, and analytics compute run independently. This enables elastic scaling across different AI workloads without keeping expensive infrastructure running idle.
      Unified serving and analytics on the same data foundation:
      Real-time serving, interactive discovery, and offline analytics operate directly on the same lake-native data foundation, avoiding unnecessary data copies, fragmented systems, and redundant pipelines.
      Indexes become reusable lake-native assets:
      Indexes are stored and managed on object storage instead of being tightly coupled to a serving engine. The same indexes can support serving, discovery, and analytics workloads together.
      Elastic and workload-aware compute:
      Different compute layers can independently optimize for low-latency serving, interactive discovery, or offline analytics. Serving workloads can use always-on clusters for consistent low latency, while on-demand compute modes improve efficiency for bursty and exploratory workloads.
      Open, multi-modal, and semantic-centric by design:
      Structured data, documents, logs, embeddings, metadata, entities, summaries, and feedback signals can coexist and be managed together on the same open lake-native foundation without proprietary lock-in.
      Built for the full AI data lifecycle:
      Vector Lakebase supports the full lifecycle of AI data workflows, including ingestion, retrieval, discovery, deduplication, clustering, analytics, evaluation.
      These are the core architectural attributes of a Vector Lakebase — the next evolution of AI data infrastructure for large-scale AI applications and agents.
    response_outline:
      - "Definition"
      - "Architecture comparison"
      - "Key features"
    style:
      language: "same as user"
      tone: "concise, helpful"

  - intent_id: vector_lakebase_only_need_vector_db
