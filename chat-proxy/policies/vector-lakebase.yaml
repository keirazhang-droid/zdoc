      - "Users can use the serving-cluster layer exactly like a regular vector database."
      - "Serving-only usage does not require extra platform complexity or additional platform costs."
      - "Vector Lakebase provides an upgrade path to discovery and analytics on the same data foundation."
    must_include:
      - "quick answer: yes"
      - "vector database is already part of vector lakebase"
      - "upgrade path"
    trigger_phrases:
      - "I only need a vector database — is Vector Lakebase still a good fit for my use case?"
      - "i only need a vector database is vector lakebase a good fit"
      - "can i use vector lakebase just for vector search"
    must_not_say:
      - "Users must adopt discovery and analytics first"
      - "Serving-only usage has extra mandatory complexity"
    fallback_response: |
      Quick answer: YES.
      A simple way to think about it: Vector Database is already part of Vector Lakebase. If you only need vector search and retrieval, you can simply use the serving cluster layer exactly like a regular vector database — with an identical user experience, no extra complexity, and no additional platform costs.
      At the same time, Vector Lakebase gives you a natural upgrade path toward a unified semantic data infrastructure. You can start with a standard vector database workload today, then seamlessly expand into search, analytics, discovery, and broader AI data workflows later — all on the same data foundation, without rebuilding systems or duplicating data.
    response_outline:
