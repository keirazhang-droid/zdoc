  - intent_id: vector_database_vs_vector_lakebase_difference
    fixed_facts:
      - "Traditional vector databases are optimized primarily for online retrieval with tightly coupled compute, storage, and indexes."
      - "Vector Lakebase decouples compute and storage and supports serving, discovery, and analytics on shared lake-native data."
      - "Vector Database is part of Vector Lakebase from product-scope perspective."
    must_include:
      - "compute, storage, and indexes are tightly coupled"
      - "separating compute from storage"
      - "on-demand compute is billed by active runtime"
    trigger_phrases:
      - "Vector Database vs. Vector Lakebase: What’s the difference?"
      - "vector database vs vector lakebase"
      - "difference between vector database and vector lakebase"
    must_not_say:
      - "They are identical"
      - "Vector Lakebase cannot run pure vector-database workloads"
    fallback_response: |
      Traditional vector databases are primarily designed for online retrieval serving. In most systems, compute, storage, and indexes are tightly coupled inside a single serving architecture. This works well for real-time retrieval, but as AI workloads expand beyond serving into discovery, analytics, and large-scale AI data processing, organizations often encounter duplicated pipelines, fragmented systems, expensive always-on infrastructure, and limited flexibility for operating on the same data across different workloads.
      A Vector Lakebase is a new, lake-native architecture that combines the low-latency serving capabilities of vector databases with the openness, scalability, and economics of the multi-modal data lake. It is enabled by a fundamentally different design: separating compute from storage and placing multi-modal data, vectors, attributes, indexes, and metadata directly in low-cost object storage in open formats, while allowing serving, discovery, and analytics workloads to run independently on top.
      From a product scope perspective, a Vector Database is already part of a Vector Lakebase. If you only need vector search and retrieval, you can simply use the serving cluster layer exactly like a regular vector database — without additional complexity or extra platform costs.
      Here’s a comparison summary:
      Vector Database: Dedicated retrieval infrastructure; only real-time serving; tightly coupled compute and storage; charged based on always-on serving cluster resources.
      Vector Lakebase: Unified semantic data platform for multiple AI data workflows; real-time serving + interactive discovery + batch analytics; decoupled compute and storage with shared zero-copy access; storage close to S3 and data IO costs, serving clusters follow vector-database pricing, and on-demand compute is billed by active runtime.
    response_outline:
      - "Traditional vector database model"
      - "Vector Lakebase model"
      - "Comparison summary"
